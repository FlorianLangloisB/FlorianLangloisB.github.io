<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chronologie du MCU, scène par scène</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#15172e;--panel:#1f2244;--line:#3a3e72;--tx:#eceaf6;--mut:#9fa1c9;
--p0:#9a86ff;--p1:#f2b441;--p2:#ef6f5e;--p3:#3cc9b4;--p4:#5b9bff;--p5:#f27fb8;
--a0:#9a86ff;--a1:#f2b441;--a2:#ef6f5e;--a3:#3cc9b4;--a4:#5b9bff;--a5:#f27fb8;--a6:#a8d95b;--a7:#ffa25c}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.4;
background:radial-gradient(900px 500px at 85% -5%,#3a3f9a55,transparent),radial-gradient(700px 400px at 0% 30%,#7a3a8a33,transparent),var(--bg);min-height:100vh}
header{max-width:900px;margin:0 auto;padding:4rem 1.25rem 1.5rem}
h1{margin:0;font-size:clamp(2.4rem,8vw,5rem);line-height:.95;font-weight:800;letter-spacing:-.035em}
header p{color:var(--mut);max-width:52rem;margin:1.1rem 0 1.6rem;font-size:1.05rem;line-height:1.65}
#cnt{font-weight:600}
.tools{position:sticky;top:0;z-index:5;background:rgba(21,23,46,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tools>div{max-width:900px;margin:0 auto;padding:.6rem 1.25rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
input[type=search],select{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.45rem .7rem;min-width:0;max-width:100%}
input[type=search]{flex:1 1 11rem}
main{max-width:900px;margin:0 auto;padding:1rem 1.25rem 5rem;position:relative}
ol{list-style:none;margin:0;padding:0}
.sec h2{margin:3.2rem 0 1rem;font-size:clamp(1.6rem,5vw,2.6rem);font-weight:800;letter-spacing:-.025em;line-height:1.05;padding-bottom:.5rem;border-bottom:3px solid var(--dc)}
.row{display:grid;grid-template-columns:clamp(4.2rem,15vw,8rem) 1.5rem 1fr;gap:0 1rem}
.yr{padding-top:.5rem;text-align:right;font-weight:800;font-size:clamp(1.05rem,3.6vw,1.8rem);letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line);transform:translateX(-50%)}
.rail i{position:absolute;left:50%;top:1.2rem;width:.9rem;height:.9rem;border-radius:50%;border:2px solid var(--dc);background:var(--dc);box-shadow:0 0 0 3px var(--bg);transform:translate(-50%,-50%)}
.card{position:relative;display:flex;gap:.8rem;align-items:flex-start;padding:.65rem 1rem;margin-bottom:.45rem;background:var(--panel);border-radius:10px;border-left:4px solid var(--pc)}
.card:hover{background:#262a55}
.body{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.t{font-weight:800;font-size:1.08rem;line-height:1.25}
.w{font-size:.85rem;font-weight:600;color:var(--pc)}
.poster,.more{cursor:zoom-in}
.more{color:var(--pc);font-size:.82rem;background:none;border:0;padding:0;font-family:inherit}
#pop{position:fixed;z-index:20;width:min(280px,calc(100vw - 16px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px #000a;padding:.6rem;pointer-events:none}
#pop[hidden]{display:none}
#pop img{display:block;width:100%;height:auto;max-height:40vh;object-fit:contain;border-radius:8px}
#pop b{display:block;margin:.6rem .2rem .1rem;font-size:1.05rem}
#pop small{display:block;margin:0 .2rem;color:var(--pc)}
#pop p{margin:.5rem .2rem .2rem;line-height:1.45;white-space:pre-line}
.poster{width:112px;height:auto;border-radius:8px;flex:none;background:var(--bg);box-shadow:0 2px 10px #0006}
.m{font-size:.82rem;color:var(--mut)}
.ts{font-size:.82rem;color:var(--mut);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.brblock{margin:.3rem 0 1.1rem;padding-left:1rem;border-left:3px solid var(--pc)}
.brblock .bh{display:inline-flex;align-items:center;gap:.45rem;font-weight:700;font-size:.82rem;color:var(--pc);letter-spacing:.02em;margin:.4rem 0 .6rem;padding:.2rem .7rem;border:1px solid var(--pc);border-radius:99px}
.brblock .bh i{width:.5rem;height:.5rem;border-radius:50%;background:var(--pc);flex:none}
.brblock .row .card{border-left-width:3px}
.badge{display:inline-block;font-size:.72rem;font-weight:700;color:var(--pc);border:1px solid var(--pc);border-radius:99px;padding:.05rem .55rem;margin-inline-end:.4rem}
.msg{color:var(--mut);padding:2rem 0}
@media (max-width:520px){.row{gap:0 .6rem}.poster{width:76px}}
</style>
</head>
<body>
<header>
  <h1>Chronologie du MCU</h1>
  <p>Sur cette page, toutes les scènes du MCU triées dans l'ordre chronologique de l'histoire.
    En survolant une image (ou en tapant dessus), elle s'agrandit et affiche le détail disponible.</p>
  <div><span id="cnt"></span></div>
</header>
<div class="tools"><div>
  <select id="order" aria-label="Ordre d'affichage">
    <option value="story">Ordre chronologique (histoire)</option>
    <option value="release">Ordre de sortie</option>
  </select>
  <select id="arc" aria-label="Filtrer par arc"><option value="all">Tous les arcs</option></select>
  <input type="search" id="q" placeholder="Rechercher une scène, une série" aria-label="Rechercher">
</div></div>
<div id="pop" hidden></div>
<main><ol id="tl"><li class="msg">Chargement…</li></ol></main>

<script>
// ============ PARSE ============
// Voir timeline.txt pour la légende complète du format (en commentaires en tête de fichier).
const TS=/(\[c\])?\s*\(\s*(\d+(?:\s*:\s*\d+)+)\s*→\s*(\d+(?:\s*:\s*\d+)+)\s*\)(\s*\[audio\])?/g;
const secs=t=>t.replace(/\s/g,'').split(':').reduce((a,b)=>a*60+ +b,0);
const clean=t=>t.replace(/\s*\+\s*/g,' ').replace(/\(\s*\)/g,'').replace(/→/g,'').replace(/\s+/g,' ').replace(/[\s–-]+$/,'').trim();
function grab(e,s){
  const rest=s.replace(TS,(_,c,a,b)=>{e.ts.push([a.replace(/\s/g,''),b.replace(/\s/g,''),c?'[c] ':'']);return ' '});
  e.dur=e.ts.reduce((n,[a,b])=>n+Math.max(0,secs(b)-secs(a)),0)/60;return rest;
}
const EP=/[ée]pisode\s*\d+/i;
// Sépare un titre "Série – Épisode N – Titre de la scène" (ou "Titre de la scène – Série") en
// e.w (contexte, affiché petit) et e.s (titre principal, affiché en gros). Voir la légende dans
// timeline.txt pour des exemples.
function split(e){
  const p=e.t.split(/\s[–-]\s/);
  if(p.length>1){const R=p.pop(),L=p.join(' – ');if(EP.test(L)&&!EP.test(R)){e.w=L;e.s=R}else{e.w=R;e.s=L}}
  else{const j=e.t.match(/^(.*?)\s+(jusqu.*)$/i);if(j){e.w=j[1];e.s=j[2]}else{e.w=e.t;e.s=''}}
}
function tag(s,name){
  const re=new RegExp('\\[\\s*'+name+'\\s*(?::\\s*([^\\]]+?)\\s*)?\\]','i');
  const m=s.match(re);
  if(!m)return{rest:s,val:null};
  return{rest:s.replace(re,''),val:m[1]!==undefined?m[1].trim():true};
}
function parse(txt){
  const out=[],ids={};let br='',cur=null;
  for(const raw of txt.split(/\r?\n/)){
    const s=raw.trim();
    if(!s)continue;
    if(s.startsWith('#')){continue}
    const cont=/^(\+|\(|\[c\]|→)/.test(s);
    if(cont&&cur){grab(cur,s);continue}
    let m;
    if(/^\[-+\]$/.test(s)){br='';cur=null;continue}
    if(m=s.match(/^\[-+\s*(.+?)\s*-+\]$/)){br=m[1];cur=null;out.push({k:'br',t:br});continue}
    if(!(m=s.match(/^([^:]{1,70}?)\s*:\s*(.*)$/))){out.push({k:'sec',t:s});cur=null;continue}
    const d=m[1].trim(),y4=d.match(/-?\d{3,4}/),e={k:'e',ts:[],br,dur:0};
    let body=m[2],r;
    r=tag(body,'sortie');body=r.rest;if(r.val&&r.val!==true)e.release=parseInt(r.val,10);
    r=tag(body,'img');body=r.rest;if(r.val&&r.val!==true)e.img=r.val;
    r=tag(body,'info');body=r.rest;if(r.val&&r.val!==true)e.info=r.val;
    e.t=clean(grab(e,body));
    split(e);
    const big=y4?y4[0]:/\?\?\?/.test(d)?'???':'';
    e.y=big||d;
    e.d=big?d.replace(big,'').replace(/^[\s~→(-]+|[\s)]+$/g,''):'';
    let h=5381;for(const c of e.y+e.t+(e.ts[0]||[]).join(''))h=(h*33+c.charCodeAt(0))>>>0;
    e.id=h.toString(36);ids[e.id]=(ids[e.id]||0)+1;if(ids[e.id]>1)e.id+='-'+ids[e.id];
    cur=e;out.push(e);
  }
  return out;
}
// ============ RENDU ============
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=m=>{m=Math.round(m);return m>=60?`${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')}`:`${m} min`};
const tsf=ts=>ts.length>1?ts.map(([a,b,c])=>`${c}(${a} → ${b})`).join(' + '):ts.map(([a,b,c])=>c+a+' → '+b).join('');
const yl=y=>y[0]==='-'?'– '+y.slice(1):y;
const slug=w=>w.replace(/^(suite|fin)\s+(de |du |d')?/i,'').replace(/[ée]pisode\s*\d+/ig,'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const F={arc:'all',q:'',order:'story'};
let items=[],ents=[],col={},okImg={},byId={},arcs=[];

function fillArcSelect(){
  $('arc').innerHTML='<option value="all">Tous les arcs</option>'+arcs.map(a=>`<option value="${a.idx}">${esc(a.label)}</option>`).join('');
}
function matches(e){
  const q=F.q.toLowerCase();
  if(F.arc!=='all'&&e.secIdx!==F.arc)return false;
  if(q&&!(e.t+' '+e.br+' '+e.y+' '+(e.release||'')).toLowerCase().includes(q))return false;
  return true;
}
function rowHtml(e,leftLabel){
  const bc=e.br?col[e.br]:(F.order==='story'?`var(--a${(e.secIdx||0)%8})`:'var(--p0)');
  const pic=e.img||(okImg[e.slug]?`images/${e.slug}.jpg`:'');
  const badge=e.br&&F.order==='release'?`<span class="badge" style="--pc:${bc}">${esc(e.br)}</span>`:'';
  const metaParts=F.order==='story'
    ?[e.d?`(${e.d})`:'',e.dur?fmt(e.dur):'',e.release?`Sorti en ${e.release}`:'']
    :[e.y+(e.d?` (${e.d})`:''),e.dur?fmt(e.dur):''];
  const meta=metaParts.filter(Boolean).join(' · ');
  return `<li class="row" data-rid="${e.id}" style="--pc:${bc};--dc:${bc}"><div class="yr">${leftLabel!==null?esc(leftLabel):''}</div><div class="rail"><i></i></div>
<div class="card">${pic?`<img class="poster" data-pid="${e.id}" src="${esc(pic)}" alt="" loading="lazy">`:''}
<div class="body">${badge}<span class="t">${esc(e.s||e.w)}</span>${e.s?`<span class="w">${esc(e.w)}</span>`:''}
${e.ts.length?`<span class="ts">${tsf(e.ts)}</span>`:''}${meta?`<span class="m">${esc(meta)}</span>`:''}${e.info&&!pic?`<button class="more" type="button" data-pid="${e.id}">ⓘ détails</button>`:''}</div></div></li>`;
}
function sagaHtml(br,rows){
  let prev=null;
  const body=rows.map(e=>{const first=e.y!==prev;prev=e.y;return rowHtml(e,first?e.y:null)}).join('');
  return `<li class="brblock" style="--pc:${col[br]}"><span class="bh"><i></i>${esc(br)}</span><ol>${body}</ol></li>`;
}
function renderStory(){
  let prev=null,html='',buf=null;
  const flush=()=>{if(buf){html+=sagaHtml(buf.br,buf.rows);buf=null}};
  items.forEach(e=>{
    if(e.k==='sec'){flush();prev=null;html+=`<li class="sec" style="--dc:var(--a${(e.secIdx||0)%8})"><h2>${esc(e.t)}</h2></li>`;return}
    if(e.k==='br'){flush();return}
    if(!matches(e))return;
    if(e.br){if(!buf||buf.br!==e.br)flush();if(!buf)buf={br:e.br,rows:[]};buf.rows.push(e)}
    else{flush();const first=e.y!==prev;prev=e.y;html+=rowHtml(e,first?e.y:null)}
  });
  flush();
  return html;
}
function renderRelease(){
  const rows=ents.filter(matches).slice().sort((a,b)=>{
    const ra=a.release??9999,rb=b.release??9999;
    if(ra!==rb)return ra-rb;
    return (a.s||a.w).localeCompare(b.s||b.w);
  });
  let prev=null,html='';
  rows.forEach(e=>{
    const label=e.release?String(e.release):'Date de sortie inconnue';
    const first=label!==prev;prev=label;
    html+=rowHtml(e,first?label:null);
  });
  return html;
}
function render(){
  const f=ents.filter(matches);
  $('cnt').textContent=`${f.length} scène(s) · ${fmt(f.reduce((n,e)=>n+e.dur,0))} de visionnage`;
  const html=F.order==='story'?renderStory():renderRelease();
  $('tl').innerHTML=html||'<li class="msg">Aucune scène ne correspond à ces filtres.</li>';
}
function place(t){const P=$('pop'),r=t.getBoundingClientRect(),w=P.offsetWidth,h=P.offsetHeight;
  let x=r.right+12;if(x+w>innerWidth-8)x=r.left-w-12;
  P.style.left=Math.max(8,x)+'px';P.style.top=Math.max(8,Math.min(r.top,innerHeight-h-8))+'px'}
function pop(t){
  const e=byId[t.dataset.pid];if(!e)return;
  const pic=e.img||(okImg[e.slug]?`images/${e.slug}.jpg`:''),P=$('pop');
  P.innerHTML=(pic?`<img src="${esc(pic)}" alt="">`:'')+`<b>${esc(e.s||e.w)}</b>`+(e.s?`<small>${esc(e.w)}</small>`:'')+(e.info?`<p>${esc(e.info)}</p>`:'');
  P.hidden=false;place(t);
  const im=P.querySelector('img');if(im)im.onload=()=>place(t);
}
$('tl').addEventListener('mouseover',e=>{const t=e.target.closest('[data-pid]');if(t)pop(t)});
$('tl').addEventListener('mouseout',e=>{if(e.target.closest('[data-pid]'))$('pop').hidden=true});
document.addEventListener('click',e=>{const t=e.target.closest('[data-pid]');if(t)pop(t);else if(!e.target.closest('#pop'))$('pop').hidden=true});
addEventListener('scroll',()=>{$('pop').hidden=true},{passive:true});
$('order').onchange=e=>{F.order=e.target.value;render()};
$('arc').onchange=e=>{F.arc=e.target.value==='all'?'all':parseInt(e.target.value,10);render()};
$('q').oninput=e=>{F.q=e.target.value;render()};
fetch('timeline.txt').then(r=>{if(!r.ok)throw 0;return r.text()}).then(async txt=>{
  items=parse(txt);ents=items.filter(e=>e.k==='e');
  ents.forEach(e=>byId[e.id]=e);
  let n=-1;items.forEach(e=>{if(e.k==='sec')n++;e.secIdx=Math.max(n,0)});
  arcs=items.filter(e=>e.k==='sec').map(e=>({idx:e.secIdx,label:e.t}));
  [...new Set(ents.map(e=>e.br).filter(Boolean))].forEach((n,i)=>col[n]=`var(--p${i%5+1})`);
  ents.forEach(e=>e.slug=slug(e.w));
  const u=[...new Set(ents.map(e=>e.slug).filter(Boolean))];
  await Promise.all(u.map(s=>new Promise(r=>{const i=new Image();i.onload=()=>{okImg[s]=1;r()};i.onerror=r;i.src=`images/${s}.jpg`})));
  fillArcSelect();render();
}).catch(()=>{$('tl').innerHTML='<li class="msg">Impossible de charger timeline.txt. Place-le à côté de index.html et ouvre le site via GitHub Pages ou un serveur local (python -m http.server), pas en double-cliquant sur le fichier.</li>'});
</script>
</body>
</html>
