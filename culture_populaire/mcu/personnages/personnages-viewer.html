<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les personnages du MCU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#15172e;--panel:#1f2244;--line:#3a3e72;--tx:#eceaf6;--mut:#9fa1c9;
--a0:#9a86ff;--a1:#f2b441;--a2:#ef6f5e;--a3:#3cc9b4;--a4:#5b9bff;--a5:#f27fb8;--a6:#a8d95b;--a7:#ffa25c}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.4;
background:radial-gradient(900px 500px at 85% -5%,#3a3f9a55,transparent),radial-gradient(700px 400px at 0% 30%,#7a3a8a33,transparent),var(--bg);min-height:100vh}
header{max-width:1100px;margin:0 auto;padding:4rem 1.25rem 1.5rem}
h1{margin:0;font-size:clamp(2.4rem,8vw,5rem);line-height:.95;font-weight:800;letter-spacing:-.035em}
header p{color:var(--mut);max-width:52rem;margin:1.1rem 0 1.6rem;font-size:1.05rem;line-height:1.65}
#cnt{font-weight:600}
.tools{position:sticky;top:0;z-index:5;background:rgba(21,23,46,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tools>div{max-width:1100px;margin:0 auto;padding:.6rem 1.25rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
input[type=search],select{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.45rem .7rem;min-width:0;max-width:100%}
input[type=search]{flex:1 1 11rem}
main{max-width:1100px;margin:0 auto;padding:1rem 1.25rem 5rem}
.sec h2{margin:3.2rem 0 1.3rem;font-size:clamp(1.6rem,5vw,2.6rem);font-weight:800;letter-spacing:-.025em;line-height:1.05;padding-bottom:.5rem;border-bottom:3px solid var(--dc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem;margin-bottom:1rem}
.card{position:relative;display:flex;gap:.9rem;align-items:flex-start;padding:.85rem;background:var(--panel);border-radius:12px;border-left:4px solid var(--pc)}
.card:hover{background:#262a55}
.avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;flex:none;background:var(--bg);box-shadow:0 2px 10px #0006;cursor:zoom-in}
.avatar-ph{width:76px;height:76px;border-radius:50%;flex:none;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:1.6rem;font-weight:800}
.body{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.t{font-weight:800;font-size:1.05rem;line-height:1.25}
.badges{display:flex;flex-wrap:wrap;gap:.3rem}
.badge{display:inline-block;font-size:.68rem;font-weight:700;border-radius:99px;padding:.05rem .5rem;border:1px solid var(--c);color:var(--c)}
.works{font-size:.8rem;color:var(--mut);line-height:1.4;margin:.5rem .2rem 0}
.works b{color:var(--tx);font-weight:600}
#pop{position:fixed;z-index:20;width:min(280px,calc(100vw - 16px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px #000a;padding:.6rem;pointer-events:none}
#pop[hidden]{display:none}
#pop img{display:block;width:100%;height:auto;max-height:40vh;object-fit:contain;border-radius:8px}
#pop b{display:block;margin:.6rem .2rem .1rem;font-size:1.05rem}
#pop p{margin:.5rem .2rem .2rem;line-height:1.45;white-space:pre-line;color:var(--mut)}
.msg{color:var(--mut);padding:2rem 0}
</style>
</head>
<body>
<header>
  <h1>Les personnages du MCU</h1>
  <p>Triés par saga d'appartenance (la première listée, si un personnage en a plusieurs — les autres
    apparaissent en badges secondaires), dans l'ordre où ils sont écrits dans le fichier.
    Survole ou tape sur un portrait pour l'agrandir.</p>
  <div><span id="cnt"></span></div>
</header>
<div class="tools"><div>
  <select id="saga" aria-label="Filtrer par saga"><option value="all">Toutes les sagas</option></select>
  <input type="search" id="q" placeholder="Rechercher un personnage, une œuvre" aria-label="Rechercher">
</div></div>
<div id="pop" hidden></div>
<main id="main"><p class="msg">Chargement…</p></main>

<script>
// ============ PARSE ============
// Voir personnages.txt pour la légende complète du format.
function tag(s,name){
  const re=new RegExp('\\[\\s*'+name+'\\s*(?::\\s*([^\\]]+?)\\s*)?\\]','i');
  const m=s.match(re);
  if(!m)return{rest:s,val:null};
  return{rest:s.replace(re,''),val:m[1]!==undefined?m[1].trim():true};
}
const clean=t=>t.replace(/\s+/g,' ').trim();
const splitList=v=>v?v.split(',').map(x=>x.trim()).filter(Boolean):[];
function parse(txt){
  // Une fiche personnage = un bloc de lignes consécutives non vides ; une ligne vide
  // sépare deux fiches. À l'intérieur d'un bloc, le nom et les tags peuvent être
  // répartis sur autant de lignes qu'on veut (un tag par ligne, ou tout sur une
  // seule ligne comme avant : les deux marchent).
  const blocks=[];let cur=[];
  for(const raw of txt.split(/\r?\n/)){
    const s=raw.trim();
    if(s.startsWith('#'))continue;
    if(!s){if(cur.length){blocks.push(cur);cur=[]}continue}
    cur.push(s);
  }
  if(cur.length)blocks.push(cur);
  const out=[],ids={};
  for(const lines of blocks){
    let body=lines.join(' '),r;
    r=tag(body,'sagas');body=r.rest;const sagas=splitList(r.val&&r.val!==true?r.val:'');
    r=tag(body,'oeuvres');body=r.rest;let oeuvres=splitList(r.val&&r.val!==true?r.val:'');
    if(!oeuvres.length){r=tag(body,'œuvres');body=r.rest;oeuvres=splitList(r.val&&r.val!==true?r.val:'')}
    r=tag(body,'img');body=r.rest;const img=r.val&&r.val!==true?r.val:null;
    r=tag(body,'info');body=r.rest;const info=r.val&&r.val!==true?r.val:null;
    const name=clean(body);
    if(!name)continue;
    let h=5381;for(const c of name)h=(h*33+c.charCodeAt(0))>>>0;
    let id=h.toString(36);ids[id]=(ids[id]||0)+1;if(ids[id]>1)id+='-'+ids[id];
    out.push({name,sagas,oeuvres,img,info,id});
  }
  return out;
}
// ============ RENDU ============
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=w=>w.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const F={saga:'all',q:''};
let chars=[],col={},order=[],okImg={},byId={};

function matches(c){
  const q=F.q.toLowerCase();
  if(F.saga!=='all'&&!c.sagas.includes(F.saga))return false;
  if(q&&!(c.name+' '+c.sagas.join(' ')+' '+c.oeuvres.join(' ')).toLowerCase().includes(q))return false;
  return true;
}
function fillSagaSelect(){
  $('saga').innerHTML='<option value="all">Toutes les sagas</option>'+order.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
}
function cardHtml(c){
  const primary=c.sagas[0],pc=primary?col[primary]:'var(--a0)';
  const pic=c.img||(okImg[c.slug]?`images/${c.slug}.jpg`:'');
  const av=pic?`<img class="avatar" data-pid="${c.id}" src="${esc(pic)}" alt="" loading="lazy">`
    :`<div class="avatar-ph">${esc(c.name.slice(0,1))}</div>`;
  const badges=c.sagas.map(s=>`<span class="badge" style="--c:${col[s]||'var(--a0)'}">${esc(s)}</span>`).join('');
  return `<div class="card" style="--pc:${pc}">${av}<div class="body"><span class="t">${esc(c.name)}</span>
    ${badges?`<div class="badges">${badges}</div>`:''}</div></div>`;
}
function render(){
  const f=chars.filter(matches);
  $('cnt').textContent=`${f.length} personnage(s)`;
  let html='';
  order.forEach(saga=>{
    const rows=f.filter(c=>c.sagas[0]===saga);
    if(!rows.length)return;
    html+=`<div class="sec" style="--dc:${col[saga]}"><h2>${esc(saga)}</h2><div class="grid">${rows.map(cardHtml).join('')}</div></div>`;
  });
  const noSaga=f.filter(c=>!c.sagas.length);
  if(noSaga.length)html+=`<div class="sec" style="--dc:var(--a0)"><h2>Sans saga</h2><div class="grid">${noSaga.map(cardHtml).join('')}</div></div>`;
  $('main').innerHTML=html||'<p class="msg">Aucun personnage ne correspond à ces filtres.</p>';
}
function place(t){const P=$('pop'),r=t.getBoundingClientRect(),w=P.offsetWidth,h=P.offsetHeight;
  let x=r.right+12;if(x+w>innerWidth-8)x=r.left-w-12;
  P.style.left=Math.max(8,x)+'px';P.style.top=Math.max(8,Math.min(r.top,innerHeight-h-8))+'px'}
function pop(t){
  const c=byId[t.dataset.pid];if(!c)return;
  const pic=c.img||(okImg[c.slug]?`images/${c.slug}.jpg`:''),P=$('pop');
  const works=c.oeuvres.length?`<div class="works"><b>Apparaît dans :</b> ${esc(c.oeuvres.join(', '))}</div>`:'';
  P.innerHTML=(pic?`<img src="${esc(pic)}" alt="">`:'')+`<b>${esc(c.name)}</b>`+(c.info?`<p>${esc(c.info)}</p>`:'')+works;
  P.hidden=false;place(t);
  const im=P.querySelector('img');if(im)im.onload=()=>place(t);
}
$('main').addEventListener('mouseover',e=>{const t=e.target.closest('[data-pid]');if(t)pop(t)});
$('main').addEventListener('mouseout',e=>{if(e.target.closest('[data-pid]'))$('pop').hidden=true});
document.addEventListener('click',e=>{const t=e.target.closest('[data-pid]');if(t)pop(t);else if(!e.target.closest('#pop'))$('pop').hidden=true});
addEventListener('scroll',()=>{$('pop').hidden=true},{passive:true});
$('saga').onchange=e=>{F.saga=e.target.value;render()};
$('q').oninput=e=>{F.q=e.target.value;render()};
fetch('personnages.txt').then(r=>{if(!r.ok)throw 0;return r.text()}).then(async txt=>{
  chars=parse(txt);
  chars.forEach(c=>byId[c.id]=c);
  chars.forEach(c=>c.slug=slug(c.name));
  // Ordre des sections = ordre d'apparition de chaque saga (en tant que saga PRINCIPALE)
  // dans le fichier ; à l'intérieur d'une section, tri alphabétique des personnages.
  chars.forEach(c=>{const p=c.sagas[0];if(p&&!order.includes(p))order.push(p)});
  order.forEach((s,i)=>col[s]=`var(--a${i%8})`);
  // Pas de tri : les personnages gardent l'ordre du fichier, aussi bien pour l'ordre
  // des sections (saga principale) que pour l'ordre à l'intérieur d'une même section.
  const u=[...new Set(chars.map(c=>c.slug).filter(Boolean))];
  await Promise.all(u.map(s=>new Promise(r=>{const i=new Image();i.onload=()=>{okImg[s]=1;r()};i.onerror=r;i.src=`images/${s}.jpg`})));
  fillSagaSelect();render();
}).catch(()=>{$('main').innerHTML='<p class="msg">Impossible de charger personnages.txt. Place-le à côté de personnages.html et ouvre le site via GitHub Pages ou un serveur local (python -m http.server), pas en double-cliquant sur le fichier.</p>'});
</script>
</body>
</html>
